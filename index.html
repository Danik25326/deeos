<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>DEEOS — New Tab</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#060d18;--bg2:#0b1828;--blue:#14b8e0;--blue-dim:#0e90b2;
    --yellow:#F2CC50;--text:#eaf4ff;--text-dim:#7aaec8;--border:#1c3550;
  }
  html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:monospace;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(20,184,224,0.15) 1px,transparent 1px),linear-gradient(90deg,rgba(20,184,224,0.15) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
  .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;}
  .orb-blue{width:700px;height:700px;background:var(--blue);top:-250px;left:-150px;opacity:0.22;}
  .orb-yellow{width:500px;height:500px;background:var(--yellow);bottom:-200px;right:-100px;opacity:0.13;}
  .orb-center{width:300px;height:300px;background:var(--blue);top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.05;filter:blur(80px);}
  .shell{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:0 24px;}
  .logo-block{display:flex;align-items:center;gap:20px;margin-bottom:48px;opacity:0;animation:fadeUp 0.6s ease 0.1s forwards;}
  .logo-d{width:72px;height:72px;flex-shrink:0;filter:drop-shadow(0 0 16px rgba(20,184,224,0.6)) drop-shadow(0 0 32px rgba(20,184,224,0.3));}
  .logo-d svg{width:100%;height:100%;}
  .logo-text{font-size:22px;font-weight:700;letter-spacing:0.18em;color:var(--text);text-transform:uppercase;line-height:1.4;text-shadow:0 0 30px rgba(20,184,224,0.4);}
  .logo-text strong{display:block;font-size:11px;letter-spacing:0.45em;color:var(--text-dim);font-weight:300;margin-top:2px;}
  .omnibox-wrap{width:100%;max-width:640px;opacity:0;animation:fadeUp 0.6s ease 0.25s forwards;}
  .omnibox-label{font-size:10px;letter-spacing:0.3em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}
  .omnibox{display:flex;align-items:center;background:rgba(11,24,40,0.9);border:1px solid var(--blue);border-radius:6px;padding:16px 20px;gap:14px;transition:border-color 0.2s,box-shadow 0.2s;cursor:text;position:relative;box-shadow:0 0 8px rgba(20,184,224,0.4),0 0 20px rgba(20,184,224,0.2);}
  .omnibox.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue-dim),0 0 30px rgba(20,184,224,0.7),0 0 60px rgba(20,184,224,0.3);}
  .omnibox-icon{color:var(--blue);flex-shrink:0;font-size:16px;}
  .omnibox-typed{flex:1;font-family:monospace;font-size:15px;color:var(--blue);white-space:nowrap;overflow:hidden;text-shadow:0 0 12px rgba(20,184,224,0.6);}
  .cursor-blink{display:inline-block;width:2px;height:14px;background:var(--blue);margin-left:1px;vertical-align:middle;animation:blink 1.1s step-end infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .omnibox input{position:absolute;inset:0;background:transparent;border:none;outline:none;color:var(--text);font-family:monospace;font-size:14px;padding:14px 18px 14px 50px;width:100%;cursor:text;caret-color:var(--blue);}
  .shortcuts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:32px;max-width:640px;opacity:0;animation:fadeUp 0.6s ease 0.4s forwards;}
  .shortcut{display:flex;align-items:center;gap:8px;background:rgba(11,24,40,0.8);border:1px solid var(--border);border-radius:5px;padding:9px 16px;font-size:11px;letter-spacing:0.1em;color:var(--text-dim);text-decoration:none;transition:border-color 0.15s,color 0.15s,box-shadow 0.15s;text-transform:uppercase;}
  .shortcut:hover{border-color:var(--blue);color:var(--text);box-shadow:0 0 16px -4px rgba(20,184,224,0.4);}
  .shortcut .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .ua-tag{font-size:10px;letter-spacing:0.4em;color:var(--yellow);text-transform:uppercase;margin-top:14px;opacity:0;animation:fadeIn 1s ease 0.6s forwards;text-shadow:0 0 16px rgba(242,204,80,0.5);}
  .statusbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-top:1px solid var(--border);background:rgba(6,13,24,0.8);font-size:10px;letter-spacing:0.15em;color:var(--text-dim);z-index:2;opacity:0;animation:fadeIn 1s ease 0.8s forwards;}
  .status-left{display:flex;gap:24px;}
  .status-pill{display:flex;align-items:center;gap:6px;}
  .status-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:0.7;animation:pulse 2s ease infinite;}
  @keyframes pulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="orb orb-blue"></div>
<div class="orb orb-yellow"></div>
<div class="orb orb-center"></div>
<div class="shell">
  <div class="logo-block">
    <div class="logo-d">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M 2 2 L 7.5 2 C 6.5 3 7 4.5 7 5 Z" fill="#0C7399"/>
        <path d="M 2 2.01 L 7 5.01 L 7 11 L 5 14 L 2 14 Z" fill="#0C7399"/>
        <path d="M 7.5 2 L 9 2 C 13 2 14.5 4.5 14.5 8 C 14.5 11.5 13 14 9 14 L 5 14 L 7 11 C 9.5 11 10.5 9.5 10.5 8 C 10.5 6.5 9.5 5 7 5 C 7 4.5 6.5 3 7.5 2 Z" fill="#E1B941"/>
      </svg>
    </div>
    <div class="logo-text">DEEOS<strong>Dereross · System Online · UA</strong></div>
  </div>
  <div class="omnibox-wrap">
    <div class="omnibox-label">// адресний рядок</div>
    <div class="omnibox" id="omnibox">
      <span class="omnibox-icon">⌖</span>
      <span class="omnibox-typed" id="typed-text"></span><span class="cursor-blink" id="cursor"></span>
      <input type="text" id="search-input" placeholder="" autocomplete="off">
    </div>
  </div>
  <div class="shortcuts">
    <a class="shortcut" href="https://dl404.is-a.dev"><span class="dot" style="background:#0C7399"></span>DL404</a>
    <a class="shortcut" href="https://chuchar.lovable.app"><span class="dot" style="background:#4a9fd4"></span>ChuChar</a>
    <a class="shortcut" href="https://kovza.lovable.app"><span class="dot" style="background:#E1B941"></span>Kovza AI</a>
    <a class="shortcut" href="https://urok-plus.vercel.app"><span class="dot" style="background:#5bc87a"></span>Урок+</a>
    <a class="shortcut" href="https://hausdorff-lab.base44.app"><span class="dot" style="background:#9b7fe8"></span>Hausdorff Lab</a>
    <a class="shortcut" href="https://danil-alone.vercel.app"><span class="dot" style="background:#e87f7f"></span>Portfolio</a>
  </div>
  <div class="ua-tag">🇺🇦 &nbsp; Зроблено в Україні</div>
</div>
<div class="statusbar">
  <div class="status-left">
    <div class="status-pill"><div class="status-dot"></div><span>DEEOS</span></div>
    <span>deeos.pp.ua</span>
  </div>
  <div id="clock"></div>
</div>
<script>
const phrases=['deeos.pp.ua','dl404.is-a.dev','Що шукаємо сьогодні?','Знайди те, що треба.'];
let pi=0,ci=0,deleting=false,paused=false,realMode=false;
const el=document.getElementById('typed-text');
const cursor=document.getElementById('cursor');
const input=document.getElementById('search-input');
const omnibox=document.getElementById('omnibox');
function typeStep(){
  if(realMode)return;
  const phrase=phrases[pi];
  if(!deleting&&!paused){
    el.textContent=phrase.slice(0,++ci);
    if(ci===phrase.length){paused=true;setTimeout(()=>{paused=false;deleting=true;typeStep();},2200);return;}
  }else if(deleting&&!paused){
    el.textContent=phrase.slice(0,--ci);
    if(ci===0){deleting=false;pi=(pi+1)%phrases.length;}
  }
  setTimeout(typeStep,deleting?40:70+Math.random()*40);
}
setTimeout(typeStep,800);
input.addEventListener('focus',()=>{realMode=true;el.textContent='';cursor.style.display='none';omnibox.classList.add('active');});
input.addEventListener('blur',()=>{if(input.value===''){realMode=false;cursor.style.display='';omnibox.classList.remove('active');ci=0;deleting=false;setTimeout(typeStep,400);}});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const q=input.value.trim();
    if(!q)return;
    const isUrl=/^(https?:\/\/|www\.)/.test(q)||/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(q);
    window.location.href=isUrl?(q.startsWith('http')?q:'https://'+q):'https://deeos.pp.ua/dios.html?q='+encodeURIComponent(q);
  }
});
omnibox.addEventListener('click',()=>input.focus());
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
