<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIOS — пошук</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #060d18;
    --bg2:    #0b1828;
    --blue:   #14b8e0;
    --blue2:  #0e90b2;
    --yellow: #F2CC50;
    --text:   #eaf4ff;
    --dim:    #7aaec8;
    --faint:  #2e4d68;
    --border: #1c3550;
  }

  html, body { width:100%; min-height:100vh; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; }

  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(20,184,224,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,184,224,0.08) 1px, transparent 1px);
    background-size:48px 48px;
    pointer-events:none; z-index:0;
  }

  .orb { position:fixed; border-radius:50%; pointer-events:none; }
  .orb-1 { width:600px;height:600px;background:var(--blue);top:-250px;left:-150px;opacity:0.15;filter:blur(100px); }
  .orb-2 { width:400px;height:400px;background:var(--yellow);bottom:-150px;right:-100px;opacity:0.07;filter:blur(90px); }

  .header {
    position:relative; z-index:1;
    display:flex; flex-direction:column; gap:12px;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    background:rgba(6,13,24,0.85);
    backdrop-filter:blur(8px);
  }
  .header-top { display:flex; align-items:center; gap:12px; }
  .search-row { display:flex; gap:10px; align-items:center; }
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .logo svg { width:32px; height:32px; filter:drop-shadow(0 0 8px rgba(20,184,224,0.5)); }
  .logo-name { font-size:18px; font-weight:700; letter-spacing:0.2em; color:var(--text); }
  .logo-name span { color:var(--yellow); }

  .search-wrap {
    flex:1;
    display:flex; align-items:center;
    background:var(--bg2);
    border:1px solid var(--blue);
    border-radius:6px;
    overflow:hidden;
    transition:border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 8px rgba(20,184,224,0.4), 0 0 20px rgba(20,184,224,0.2);
  }
  .search-wrap:focus-within {
    border-color:var(--blue);
    box-shadow:0 0 0 1px var(--blue2), 0 0 30px rgba(20,184,224,0.7), 0 0 60px rgba(20,184,224,0.3);
  }
  .search-wrap input {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--blue); caret-color:var(--blue);
    font-family:'JetBrains Mono',monospace; font-size:15px;
    padding:14px 16px;
    text-shadow:0 0 10px rgba(20,184,224,0.4);
    min-width:0;
  }
  .search-wrap input::placeholder { color:var(--faint); }
  .search-btn {
    background:var(--blue); border:none; cursor:pointer;
    padding:14px 20px; color:#000; font-family:'JetBrains Mono',monospace;
    font-size:13px; letter-spacing:0.1em; font-weight:700;
    transition:background 0.15s; white-space:nowrap;
    flex-shrink:0;
  }
  .search-btn:hover { background:#1ad4ff; }

  /* ── AI ANSWER ── */
  .ai-block {
    position:relative; z-index:1;
    margin:24px 32px 0;
    max-width:860px;
    background:rgba(11,24,40,0.9);
    border:1px solid var(--blue);
    border-radius:8px;
    padding:20px 24px;
    box-shadow:0 0 20px rgba(20,184,224,0.15);
    display:none;
  }
  .ai-block.visible { display:block; }
  .ai-header {
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
    font-size:11px; letter-spacing:0.25em; color:var(--blue);
    text-transform:uppercase;
  }
  .ai-dot {
    width:6px;height:6px;border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 8px rgba(242,204,80,0.8);
    animation:pulse 2s ease infinite;
  }
  .ai-text {
    font-size:13px; color:var(--text); line-height:1.8;
    font-weight:300; white-space:pre-wrap;
  }
  .ai-typing::after {
    content:'▋';
    animation:blink 0.8s step-end infinite;
    color:var(--blue);
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ── MAIN ── */
  .main { position:relative; z-index:1; padding:32px 32px 80px; max-width:860px; }
  .stats {
    font-size:11px; color:var(--faint); letter-spacing:0.15em;
    margin-bottom:20px;
  }
  .stats span { color:var(--dim); }

  /* ── RESULTS ── */
  .result {
    margin-bottom:28px;
    padding-bottom:28px;
    border-bottom:1px solid var(--border);
    animation:fadeUp 0.3s ease both;
  }
  .result:last-child { border-bottom:none; }

  .result-url {
    font-size:11px; color:var(--blue2); letter-spacing:0.05em;
    margin-bottom:5px; opacity:0.8;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-title {
    font-size:16px; font-weight:600; color:var(--blue);
    text-decoration:none; letter-spacing:0.02em;
    display:block; margin-bottom:6px;
    text-shadow:0 0 12px rgba(20,184,224,0.3);
    transition:text-shadow 0.15s;
  }
  .result-title:hover { text-shadow:0 0 20px rgba(20,184,224,0.7); }
  .result-snippet { font-size:13px; color:var(--dim); line-height:1.7; font-weight:300; }

  /* ── EMPTY / ERROR ── */
  .message {
    font-size:13px; color:var(--dim); letter-spacing:0.05em;
    margin-top:40px; line-height:2;
  }
  .message strong { color:var(--yellow); }

  /* ── PAGINATION ── */
  .pagination {
    display:flex; gap:8px; margin-top:32px; flex-wrap:wrap;
  }
  .page-btn {
    background:var(--bg2); border:1px solid var(--border);
    color:var(--dim); font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.1em; padding:7px 14px;
    border-radius:4px; cursor:pointer;
    transition:border-color 0.15s, color 0.15s;
  }
  .page-btn:hover, .page-btn.active {
    border-color:var(--blue); color:var(--text);
  }
  .page-btn:disabled { opacity:0.3; cursor:default; }

  /* ── LOADING ── */
  .loader {
    display:none; margin-top:48px;
    font-size:12px; color:var(--faint); letter-spacing:0.3em;
    text-transform:uppercase;
  }
  .loader.visible { display:block; }
  .loader::after {
    content:''; display:inline-block;
    animation:dots 1.2s step-end infinite;
  }
  @keyframes dots {
    0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'}
  }

  /* ── STATUS BAR ── */
  .statusbar {
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 24px;
    border-top:1px solid var(--border);
    background:rgba(6,13,24,0.9);
    backdrop-filter:blur(8px);
    font-size:10px; letter-spacing:0.15em; color:var(--dim);
    z-index:10;
  }
  .status-dot {
    display:inline-block; width:5px;height:5px;border-radius:50%;
    background:var(--blue); margin-right:6px;
    animation:pulse 2s ease infinite;
    vertical-align:middle;
  }
  @keyframes pulse { 0%,100%{opacity:0.7} 50%{opacity:1;transform:scale(1.3)} }

  @keyframes fadeUp {
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-top">
    <a class="logo" href="dios.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M 2 2 L 7.5 2 C 6.5 3 7 4.5 7 5 Z" fill="#14b8e0"/>
        <path d="M 2 2.01 L 7 5.01 L 7 11 L 5 14 L 2 14 Z" fill="#14b8e0"/>
        <path d="M 7.5 2 L 9 2 C 13 2 14.5 4.5 14.5 8 C 14.5 11.5 13 14 9 14 L 5 14 L 7 11 C 9.5 11 10.5 9.5 10.5 8 C 10.5 6.5 9.5 5 7 5 C 7 4.5 6.5 3 7.5 2 Z" fill="#F2CC50"/>
      </svg>
      <span class="logo-name">DI<span>OS</span></span>
    </a>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Пошук..." autocomplete="off"
        aria-label="Пошуковий запит">
      <button class="search-btn" id="search-btn">ШУКАТИ</button>
    </div>
  </div>
</header>

<!-- AI ANSWER -->
<div class="ai-block" id="ai-block" aria-live="polite">
  <div class="ai-header"><div class="ai-dot"></div>DIOS AI · Qwen</div>
  <div class="ai-text" id="ai-text"></div>
</div>

<!-- MAIN -->
<main class="main">
  <div class="loader" id="loader" role="status" aria-live="polite">Шукаємо</div>
  <div class="stats" id="stats" aria-live="polite"></div>
  <div id="results" aria-live="polite"></div>
  <div class="pagination" id="pagination"></div>
</main>

<!-- STATUS BAR -->
<div class="statusbar">
  <div><span class="status-dot"></span>DIOS · Powered by DEEOS</div>
  <div id="clock"></div>
</div>

<script>
const AI_ENDPOINT      = 'https://dios-ai.danikrut79.workers.dev/';
const SEARCH_ENDPOINT  = 'https://dios-proxy.danikrut79.workers.dev/';
const REQUEST_TIMEOUT_MS = 12000; // 12s — щоб лоадер не крутився вічно, якщо воркер завис

// ── БЕЗПЕКА: усе, що прийшло ззовні (AI, SerpApi через proxy), могло б
// містити довільний HTML, тож ніколи не підставляємо його як innerHTML
// без екранування. Раніше title/snippet/link йшли в innerHTML напряму —
// це давало XSS-дірку, якщо джерело колись поверне щось на кшталт
// <img src=x onerror=...>.
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// fetch з таймаутом і можливістю скасування ззовні (AbortController).
// Повертає { res, aborted, timedOut }.
async function fetchWithTimeout(url, { signal } = {}) {
  const timeoutCtrl = new AbortController();
  const timer = setTimeout(() => timeoutCtrl.abort(), REQUEST_TIMEOUT_MS);

  // Об'єднуємо "зовнішній" сигнал скасування (нова відповідь користувача
  // перекрила попередню) і власний таймаут-сигнал.
  const onExternalAbort = () => timeoutCtrl.abort();
  if (signal) signal.addEventListener('abort', onExternalAbort);

  try {
    const res = await fetch(url, { signal: timeoutCtrl.signal });
    return res;
  } finally {
    clearTimeout(timer);
    if (signal) signal.removeEventListener('abort', onExternalAbort);
  }
}

let currentQuery = '';
let currentPage  = 0;
let totalResults = 0;

// Токени запитів — захист від "гонки": якщо користувач встиг ввести
// новий пошук, поки стара відповідь ще летить по мережі, стара відповідь
// просто ігнорується, навіть якщо прилетить пізніше.
let aiRequestId      = 0;
let resultsRequestId = 0;
let aiController      = null;
let resultsController = null;

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if (q) {
    document.getElementById('search-input').value = q;
    currentQuery = q;
    currentPage  = parseInt(params.get('page') || '0', 10) || 0;
    fetchAI(q);
    fetchResults(q, currentPage);
  }
  updateClock();
  setInterval(updateClock, 1000);

  document.getElementById('search-btn').addEventListener('click', doSearch);
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
});

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  currentQuery = q;
  currentPage  = 0;
  safePush(`q=${encodeURIComponent(q)}`);
  fetchAI(q);
  fetchResults(q, 0);
}

async function fetchAI(q) {
  const myId = ++aiRequestId;
  if (aiController) aiController.abort(); // скасовуємо попередній AI-запит
  aiController = new AbortController();

  const block  = document.getElementById('ai-block');
  const textEl = document.getElementById('ai-text');
  block.classList.add('visible');
  textEl.textContent = '';
  textEl.classList.add('ai-typing');

  try {
    const res = await fetchWithTimeout(
      `${AI_ENDPOINT}?q=${encodeURIComponent(q)}`,
      { signal: aiController.signal }
    );
    if (myId !== aiRequestId) return; // прийшла застаріла відповідь — ігноруємо

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (myId !== aiRequestId) return;

    textEl.classList.remove('ai-typing');
    const content = data.choices?.[0]?.message?.content;
    if (content) {
      textEl.textContent = content; // textContent — безпечно, HTML не виконується
    } else {
      block.classList.remove('visible');
    }
  } catch (e) {
    if (myId !== aiRequestId) return; // скасовано новим запитом — це не помилка
    textEl.classList.remove('ai-typing');
    if (e.name === 'AbortError') {
      textEl.textContent = 'AI не відповів вчасно.';
    } else {
      textEl.textContent = 'AI зараз недоступний.';
    }
  }
}

async function fetchResults(q, page) {
  const myId = ++resultsRequestId;
  if (resultsController) resultsController.abort(); // скасовуємо попередній пошук
  resultsController = new AbortController();

  document.getElementById('loader').classList.add('visible');
  document.getElementById('results').innerHTML = '';
  document.getElementById('stats').textContent = '';
  document.getElementById('pagination').innerHTML = '';

  // SerpApi — через proxy щоб обійти CORS
  const url = `${SEARCH_ENDPOINT}?q=${encodeURIComponent(q)}&page=${page}`;

  try {
    const res = await fetchWithTimeout(url, { signal: resultsController.signal });
    if (myId !== resultsRequestId) return; // застаріла відповідь

    document.getElementById('loader').classList.remove('visible');

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (myId !== resultsRequestId) return;

    if (data.error) {
      showMessage(`Помилка: <strong>${escapeHtml(data.error)}</strong>`);
      return;
    }

    const items = data.organic_results || [];
    totalResults = data.search_information?.total_results || 0;
    const time   = data.search_information?.time_taken_displayed || '';

    if (items.length === 0) {
      showMessage(`Нічого не знайдено по запиту <strong>"${escapeHtml(q)}"</strong>`);
      return;
    }

    document.getElementById('stats').innerHTML =
      `Знайдено <span>~${escapeHtml(Number(totalResults).toLocaleString('uk'))}</span> результатів${time ? ` за <span>${escapeHtml(time)}</span>` : ''}`;

    const container = document.getElementById('results');
    const frag = document.createDocumentFragment();
    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'result';
      div.style.animationDelay = `${i * 0.05}s`;

      const urlDiv = document.createElement('div');
      urlDiv.className = 'result-url';
      urlDiv.textContent = item.displayed_link || item.link || '';

      const titleA = document.createElement('a');
      titleA.className = 'result-title';
      titleA.target = '_blank';
      titleA.rel = 'noopener noreferrer'; // сторонні посилання не повинні отримувати доступ до window.opener
      titleA.href = /^https?:\/\//i.test(item.link || '') ? item.link : '#';
      titleA.textContent = item.title || item.link || '';

      const snippetDiv = document.createElement('div');
      snippetDiv.className = 'result-snippet';
      snippetDiv.textContent = item.snippet || '';

      div.append(urlDiv, titleA, snippetDiv);
      frag.appendChild(div);
    });
    container.appendChild(frag);

    renderPagination(page, data.serpapi_pagination);

  } catch (e) {
    if (myId !== resultsRequestId) return; // скасовано новим пошуком — не помилка
    document.getElementById('loader').classList.remove('visible');
    if (e.name === 'AbortError') {
      showMessage(`Помилка: <strong>сервер не відповів вчасно</strong>`);
    } else {
      showMessage(`Помилка з'єднання: <strong>${escapeHtml(e.message)}</strong>`);
    }
  }
}

function safePush(params) {
  try { history.pushState({}, '', '?' + params); } catch (e) {}
}

function renderPagination(currentPage, pagination) {
  if (!pagination) return;
  const pag = document.getElementById('pagination');
  // Якщо proxy повертає карту сторінок (serpapi_pagination.other_pages) —
  // рахуємо реальну кількість сторінок з неї, інакше — груба оцінка
  // за totalResults, як і раніше.
  const otherPagesCount = pagination.other_pages
    ? Object.keys(pagination.other_pages).length
    : 0;
  const pages = Math.min(10, Math.max(otherPagesCount, Math.ceil((totalResults || 100) / 10)));

  for (let i = 0; i < pages; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i + 1;
    btn.setAttribute('aria-label', `Сторінка ${i + 1}`);
    btn.onclick = () => {
      currentPage = i;
      safePush(`q=${encodeURIComponent(currentQuery)}&page=${i}`);
      fetchResults(currentQuery, i);
      window.scrollTo(0, 0);
    };
    pag.appendChild(btn);
  }
}

function showMessage(html) {
  document.getElementById('results').innerHTML = `<div class="message">${html}</div>`;
}

function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('uk-UA', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
</script>
</body>
</html>
